name: Jellyfin Watchlist Digest

on:
  # Run every Sunday at 18:00 UTC
  schedule:
    - cron: "0 18 * * 0"

  # Allow manual runs from the Actions tab for testing
  workflow_dispatch:

jobs:
  send-digest:
    name: Send Forgotten Watchlist Email
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r jellyfin-digest/requirements.txt

      - name: Run digest script
        env:
          JELLYFIN_URL: ${{ secrets.JELLYFIN_URL }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          JELLYFIN_USER_ID: ${{ secrets.JELLYFIN_USER_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python jellyfin-digest/digest.py
